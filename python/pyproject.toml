[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reshimu-shor"
version = "0.1.1"
description = "Deterministic, non-LLM grounding & hallucination classifier for agent loops."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Reshimu" }]
keywords = ["llm", "agents", "hallucination", "grounding", "classifier", "ai-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/reshimu/shor"
Repository = "https://github.com/reshimu/shor"
Issues = "https://github.com/reshimu/shor/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "mypy>=1.8",
    "ruff>=0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["reshimu_shor"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["reshimu_shor"]
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
